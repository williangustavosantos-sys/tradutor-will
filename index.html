function variantSuffix(variant) {
  return variant === 'uk'
    ? `\n\n=== VARIANTE DE INGLÊS: BRITÂNICO (EN-GB) ===\n` +
      `- Use SOTAQUE britânico (RP / Estuário, NÃO americano)\n` +
      `- Vocabulário britânico: "trainers" (não "sneakers"), "lift" (não "elevator"), ` +
      `"brilliant"/"lovely"/"cheers", "mate", "press-up", "well done"/"spot on"\n` +
      `- Ortografia britânica: "colour", "centre", "realise", "favourite"`
    : `\n\n=== VARIANTE DE INGLÊS: AMERICANO (EN-US) ===\n` +
      `- Use SOTAQUE americano (General American)\n` +
      `- Vocabulário americano: "sneakers", "elevator", "awesome"/"great", ` +
      `"buddy"/"dude", "push-up", "you got it"\n` +
      `- Ortografia americana: "color", "center", "realize", "favorite"`;
}

function buildSystemPrompt(langAId, langBId) {
  const a = langById(langAId), b = langById(langBId);
  if (!a || !b) return PROMPT_PT_EN;

  const bases = new Set([a.base, b.base]);
  let base;
  if (bases.has('pt') && bases.has('en')) base = PROMPT_PT_EN;
  else if (bases.has('pt') && bases.has('it')) base = PROMPT_PT_IT;
  else if (bases.has('en') && bases.has('it')) base = PROMPT_EN_IT;
  else base = PROMPT_PT_EN;

  // Variante de inglês quando aplicável
  const enLang = [a, b].find(l => l.base === 'en');
  if (enLang) {
    const variant = enLang.id === 'en-GB' ? 'uk' : 'us';
    base = base + variantSuffix(variant);
  }

  return base;
}


// Extrai idioma da resposta e limpa a pergunta (ex.: "... responde em inglês")
function parseSearchRequest(text, config, defaultLangId) {
  let query = (text || '').trim();
  let langId = defaultLangId || config.langA;

  const pickByBase = (base) => {
    const ids = [config.langA, config.langB];
    const inSession = ids.find(id => langById(id)?.base === base);
    if (inSession) return inSession;
    if (base === 'pt') return 'pt-BR';
    if (base === 'en') return ids.find(id => langById(id)?.base === 'en') || 'en-US';
    if (base === 'it') return 'it';
    return defaultLangId || config.langA;
  };

  const rules = [
    { re: /(?:^|[\s,.])(?:responde|responder|fala|falar|diz|diga|em)\s+(?:em\s+)?portugu[eê]s(?:\s+brasileiro)?\s*[,:.\-]?\s*/gi, base: 'pt' },
    { re: /(?:^|[\s,.])(?:respond|answer|speak|say|in)\s+(?:in\s+)?(?:english|ingl[eê]s)\s*[,:.\-]?\s*/gi, base: 'en' },
    { re: /(?:^|[\s,.])(?:rispondi|rispondere|parla|in)\s+(?:in\s+)?italiano\s*[,:.\-]?\s*/gi, base: 'it' },
    { re: /(?:^|[\s,.])(?:em\s+)?portugu[eê]s\s*[,:.\-]?\s*$/gi, base: 'pt' },
    { re: /(?:^|[\s,.])(?:in\s+)?(?:english|ingl[eê]s)\s*[,:.\-]?\s*$/gi, base: 'en' },
    { re: /(?:^|[\s,.])(?:in\s+)?italiano\s*[,:.\-]?\s*$/gi, base: 'it' },
    { re: /\b(responde|responder)\s+em\s+(pt|portugu[eê]s)\b/gi, base: 'pt' },
    { re: /\b(respond|answer)\s+in\s+(en|english|ingl[eê]s)\b/gi, base: 'en' },
    { re: /\b(rispondi|rispondere)\s+in\s+(it|italiano)\b/gi, base: 'it' },
  ];

  for (const { re, base } of rules) {
    if (re.test(query)) {
      langId = pickByBase(base);
      query = query.replace(re, ' ').replace(/\s+/g, ' ').trim();
      re.lastIndex = 0;
    }
  }

  if (!query) query = (text || '').trim();
  return { query, langId };
}

// Pesquisa na internet (API REST separada — não interfere no tradutor ao vivo)
async function searchInternet(query, langId) {
  const lang = langById(langId);
  const apiKey = APP_CONFIG.DEFAULT_API_KEY || localStorage.getItem('gemini_api_key');
  if (!apiKey) throw new Error('Falta a API key (config.js).');
  const res = await fetch(
    `${geminiRestUrl('generateContent')}?key=${encodeURIComponent(apiKey)}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: query.trim() }] }],
        tools: [{ googleSearch: {} }],
        systemInstruction: {
          parts: [{ text: `Responda em ${lang?.label || 'português'}. Seja direto, até 5 frases.` }],
        },
      }),
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Erro na pesquisa');
  const parts = data.candidates?.[0]?.content?.parts || [];
  const text = parts.map(p => p.text).filter(Boolean).join('\n');
  return text || 'Não encontrei resposta.';
}

// ==========================================
// LANGUAGE DETECTION (pra rotear traduções pra metade certa)
// ==========================================
function detectBase(text) {
  if (!text) return null;
  const t = text.toLowerCase();
  if (/[ãõçâê]/.test(t)) return 'pt';
  if (/[ìòù]/.test(t) && !/[ãõ]/.test(t)) return 'it';
  if (/\b(oi|tudo|obrigado|obrigada|bom|boa|sim|não|tá|né|então|vamos|pra|pro|fala|olá)\b/.test(t)) return 'pt';
  if (/\b(hi|hello|hey|yeah|yes|nope|thanks|sorry|please|sure|right|well|alright|nice|cool)\b/.test(t)) return 'en';
  if (/\b(ciao|buon|buona|grazie|prego|scusa|bravo|brava|dai|perfetto)\b/.test(t)) return 'it';
  if (/\b(você|isso|estou|aqui|aí|treino|força|agachamento|série|carga|respira)\b/.test(t)) return 'pt';
  if (/\b(non|molto|bene|allora|sono|sei|sì|adesso|forza)\b/.test(t)) return 'it';
  if (/\b(the|you|your|good|okay|great|breathe|squeeze|let's|one|more|rep|set|how|are|doing)\b/.test(t)) return 'en';
  if (/\b(é|um|uma|esse|essa|este|esta|para|com|mas|mais|também)\b/.test(t)) return 'pt';
  return null;
}

// AUDIO UTILS

function base64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function arrayBufferToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '', chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(s);
}
function int16ToFloat32(int16) {
  const f = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f[i] = int16[i] / 0x8000;
  return f;
}

let previewAudioCtx = null;
let previewVoiceAbort = null;

// Preview usa a mesma Live API e o mesmo modelo da sessão (áudio não funciona no REST)
async function playVoiceSample(voiceName, langId) {
  if (previewVoiceAbort) previewVoiceAbort();

  const lang = langById(langId);
  const base = lang?.base || 'pt';
  const phrase = VOICE_SAMPLE_PHRASE[base] || VOICE_SAMPLE_PHRASE.pt;
  const apiKey = APP_CONFIG.DEFAULT_API_KEY || localStorage.getItem('gemini_api_key');
  if (!apiKey) throw new Error('Falta a API key (config.js).');

  return new Promise((resolve, reject) => {
    let settled = false;
    let ws = null;
    let nextPlay = 0;
    let heardAudio = false;

    const done = (err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      previewVoiceAbort = null;
      if (ws) { try { ws.close(); } catch (_) {} ws = null; }
      if (err) reject(err);
      else resolve();
    };

    previewVoiceAbort = () => done(new Error('Cancelado'));

    const timer = setTimeout(() => done(new Error('Tempo esgotado ao ouvir a voz')), 15000);

    if (!previewAudioCtx) previewAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = previewAudioCtx;

    function queueChunk(b64) {
      const int16 = new Int16Array(base64ToArrayBuffer(b64));
      const f32 = int16ToFloat32(int16);
      if (f32.length === 0) return;
      heardAudio = true;
      const ab = ctx.createBuffer(1, f32.length, 24000);
      ab.copyToChannel(f32, 0);
      const src = ctx.createBufferSource();
      src.buffer = ab;
      src.connect(ctx.destination);
      const at = Math.max(nextPlay, ctx.currentTime);
      src.start(at);
      nextPlay = at + ab.duration;
    }

    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(apiKey)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: GEMINI_MODEL,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } },
            temperature: 0.2,
          },
          systemInstruction: {
            parts: [{ text: 'Repita em voz alta, com entonação natural, exatamente o texto que o usuário enviar. Não acrescente nada.' }],
          },
        },
      }));
    };

    ws.onmessage = async (e) => {
      const raw = e.data instanceof Blob ? await e.data.text() : e.data;
      let msg;
      try { msg = JSON.parse(raw); } catch (_) { return; }

      if (msg.error) {
        done(new Error(msg.error.message || 'Erro ao ouvir a voz'));
        return;
      }

      if (msg.setupComplete !== undefined) {
        ws.send(JSON.stringify({
          clientContent: {
            turns: [{ role: 'user', parts: [{ text: phrase }] }],
            turnComplete: true,
          },
        }));
        return;
      }

      const sc = msg.serverContent;
      if (!sc) return;

      if (sc.modelTurn?.parts) {
        if (ctx.state === 'suspended') await ctx.resume();
        for (const part of sc.modelTurn.parts) {
          if (part.inlineData?.mimeType?.startsWith('audio/pcm') && part.inlineData.data) {
            queueChunk(part.inlineData.data);
          }
        }
      }

      if (sc.turnComplete) {
        if (!heardAudio) {
          done(new Error('Nenhum áudio recebido'));
          return;
        }
        const waitMs = Math.max(400, (nextPlay - ctx.currentTime) * 1000 + 250);
        setTimeout(() => done(), waitMs);
      }
    };

    ws.onerror = () => done(new Error('Erro de conexão ao ouvir a voz'));
    ws.onclose = () => { if (!settled && !heardAudio) done(new Error('Conexão fechada')); };
  });
}

// Fala o resultado de pesquisa via WebSocket separado (não interfere no tradutor)
async function speakSearchResult(text, voiceName) {
  if (!text || !text.trim()) return;
  const apiKey = APP_CONFIG.DEFAULT_API_KEY || localStorage.getItem('gemini_api_key');
  if (!apiKey) return;

  if (!previewAudioCtx) previewAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = previewAudioCtx;
  if (ctx.state === 'suspended') await ctx.resume();

  return new Promise((resolve) => {
    let settled = false;
    let ws = null;
    let nextPlay = 0;
    let heardAudio = false;

    const done = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (ws) { try { ws.close(); } catch (_) {} }
      const wait = heardAudio ? Math.max(200, (nextPlay - ctx.currentTime) * 1000 + 200) : 0;
      setTimeout(resolve, wait);
    };

    const timer = setTimeout(done, 20000);

    const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(apiKey)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: GEMINI_MODEL,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceName || 'Aoede' } } },
            temperature: 0.1,
          },
          systemInstruction: {
            parts: [{ text: 'Leia em voz alta exatamente o texto enviado pelo usuário, sem traduzir, sem alterar, sem comentar.' }],
          },
        },
      }));
    };

    ws.onmessage = async (e) => {
      const raw = e.data instanceof Blob ? await e.data.text() : e.data;
      let msg; try { msg = JSON.parse(raw); } catch (_) { return; }
      if (msg.setupComplete !== undefined) {
        ws.send(JSON.stringify({
          clientContent: { turns: [{ role: 'user', parts: [{ text: text.trim() }] }], turnComplete: true },
        }));
        return;
      }
      const sc = msg.serverContent;
      if (!sc) return;
      if (sc.modelTurn?.parts) {
        if (ctx.state === 'suspended') await ctx.resume();
        for (const part of sc.modelTurn.parts) {
          if (part.inlineData?.mimeType?.startsWith('audio/pcm') && part.inlineData.data) {
            const int16 = new Int16Array(base64ToArrayBuffer(part.inlineData.data));
            const f32 = int16ToFloat32(int16);
            if (f32.length === 0) continue;
            heardAudio = true;
            const ab = ctx.createBuffer(1, f32.length, 24000);
            ab.copyToChannel(f32, 0);
            const src = ctx.createBufferSource();
            src.buffer = ab;
            src.connect(ctx.destination);
            const at = Math.max(nextPlay, ctx.currentTime);
            src.start(at);
            nextPlay = at + ab.duration;
          }
        }
      }
      if (sc.turnComplete) done();
    };

    ws.onerror = () => done();
    ws.onclose = () => done();
  });
}

// ==========================================
// HOOK: useTranslator
// ==========================================
function useTranslator() {
  const [status, setStatus] = React.useState('idle'); // idle | connecting | active | reconnecting | error
  const [paused, setPaused] = React.useState(false);
  const [audioOn, setAudioOn] = React.useState(true);
  const [micOn, setMicOn] = React.useState(true);
  const [elapsed, setElapsed] = React.useState(0);
  const [error, setError] = React.useState(null);
  const [transA, setTransA] = React.useState([]);
  const [transB, setTransB] = React.useState([]);
  const configRef = React.useRef(null);
  const wsRef = React.useRef(null);
  const inputCtxRef = React.useRef(null);
  const outputCtxRef = React.useRef(null);
  const micStreamRef = React.useRef(null);
  const workletRef = React.useRef(null);
  const wakeLockRef = React.useRef(null);
  const nextPlayTimeRef = React.useRef(0);
  const reconnectRef = React.useRef(0);
  const timerRef = React.useRef(null);
  const startTimeRef = React.useRef(null);
  const pausedRef = React.useRef(false);
  const audioOnRef = React.useRef(true);
  const micOnRef = React.useRef(true);
  const statusRef = React.useRef('idle');
  const lastInputLangRef = React.useRef(null);
  const outputTargetRef = React.useRef(null);
  const inputAccumRef = React.useRef(false);
  const outputAccumRef = React.useRef(false);
  const isPlayingAudioRef = React.useRef(false);
  const playEndTimeoutRef = React.useRef(null);
  const transLenRef = React.useRef({ A: 0, B: 0 });
  const searchModeRef = React.useRef(false);
  const searchOnUtteranceRef = React.useRef(null);
  const searchUtteranceBufRef = React.useRef('');

  React.useEffect(() => { pausedRef.current = paused; }, [paused]);
  React.useEffect(() => { audioOnRef.current = audioOn; }, [audioOn]);
  React.useEffect(() => { micOnRef.current = micOn; }, [micOn]);
  React.useEffect(() => { statusRef.current = status; }, [status]);
  function resetTranscriptionState() {
    lastInputLangRef.current = null;
    outputTargetRef.current = null;
    inputAccumRef.current = false;
    outputAccumRef.current = false;
  }

  function beginNewTurn() {
    inputAccumRef.current = false;
    outputAccumRef.current = false;
    outputTargetRef.current = null;
  }

  function resolveTarget(detected, a, b) {
    if (detected === a.base && detected !== b.base) return 'A';
    if (detected === b.base && detected !== a.base) return 'B';
    return null;
  }

  function setSearchMode(on, onUtterance) {
    searchModeRef.current = !!on;
    searchOnUtteranceRef.current = on ? onUtterance : null;
    if (!on) {
      searchUtteranceBufRef.current = '';
    }
  }

  // INPUT: o que foi dito (mic) ou digitado. Incremental = SUBSTITUI último item do mesmo turno.
  function appendInputTranscription(text, opts) {
    if (!text || !text.trim()) return;

    if (searchModeRef.current) {
      const isAccum = inputAccumRef.current;
      if (!isAccum && !opts?.skipBeginTurn) beginNewTurn();
      inputAccumRef.current = true;
      searchUtteranceBufRef.current = isAccum
        ? (searchUtteranceBufRef.current + ' ' + text).trim()
        : text.trim();
      return;
    }

    const cfg = configRef.current;
    if (!cfg) return;
    const a = langById(cfg.langA), b = langById(cfg.langB);
    if (!a || !b) return;

    const isAccum = inputAccumRef.current;
    if (!isAccum && !opts?.skipBeginTurn) beginNewTurn();

    outputTargetRef.current = null;
    outputAccumRef.current = false;

    const detected = detectBase(text);
    if (detected) lastInputLangRef.current = detected;

    const target = resolveTarget(detected, a, b) || 'A';
    inputAccumRef.current = true;

    const entry = { text, isOutput: false };
    const setter = target === 'A' ? setTransA : setTransB;
    setter(prev => {
      const next = isAccum && prev.length > 0 ? [...prev.slice(0, -1), entry] : [...prev, entry];
      const capped = next.length > MAX_TRANSLATIONS ? next.slice(-MAX_TRANSLATIONS) : next;
      transLenRef.current[target] = capped.length;
      return capped;
    });
  }

  // OUTPUT: a tradução gerada pelo modelo. Vai pro lado OPOSTO ao input.
  // Fragmentos da mesma resposta CONCATENAM no mesmo item.
  function appendOutputTranscription(text) {
    if (searchModeRef.current) return;
    if (!text || !text.trim()) return;
    const cfg = configRef.current;
    if (!cfg) return;
    const a = langById(cfg.langA), b = langById(cfg.langB);
    if (!a || !b) return;

    inputAccumRef.current = false;

    let target = outputTargetRef.current;
    if (!target) {
      const inputLang = lastInputLangRef.current;
      if (inputLang === a.base && inputLang !== b.base) target = 'B';
      else if (inputLang === b.base && inputLang !== a.base) target = 'A';
      else {
        const det = detectBase(text);
        target = resolveTarget(det, a, b) || 'B';
      }
      outputTargetRef.current = target;
    }

    const isAccum = outputAccumRef.current;
    outputAccumRef.current = true;

    const setter = target === 'A' ? setTransA : setTransB;
    setter(prev => {
      let next;
      if (isAccum && prev.length > 0) {
        const last = prev[prev.length - 1];
        next = [...prev.slice(0, -1), { text: last.text + ' ' + text, isOutput: true }];
      } else {
        next = [...prev, { text, isOutput: true }];
      }
      const capped = next.length > MAX_TRANSLATIONS ? next.slice(-MAX_TRANSLATIONS) : next;
      transLenRef.current[target] = capped.length;
      return capped;
    });

    if (navigator.vibrate) navigator.vibrate(50);
  }

  function playAudioChunk(b64) {
    if (searchModeRef.current) return;
    if (!audioOnRef.current) {
      isPlayingAudioRef.current = false;
      return;
    }
    if (!outputCtxRef.current) return;
    const buf = base64ToArrayBuffer(b64);
    const int16 = new Int16Array(buf);
    const f32 = int16ToFloat32(int16);
    if (f32.length === 0) return;
    const ctx = outputCtxRef.current;
    const ab = ctx.createBuffer(1, f32.length, 24000);
    ab.copyToChannel(f32, 0);
    const src = ctx.createBufferSource();
    src.buffer = ab;
    src.connect(ctx.destination);
    const now = ctx.currentTime;
    const at = Math.max(nextPlayTimeRef.current, now);
    src.start(at);
    nextPlayTimeRef.current = at + ab.duration;

    isPlayingAudioRef.current = true;
    clearTimeout(playEndTimeoutRef.current);
    const endMs = (at + ab.duration - now) * 1000 + 300;
    playEndTimeoutRef.current = setTimeout(() => { isPlayingAudioRef.current = false; }, endMs);
  }

  function interruptPlayback() {
    if (outputCtxRef.current) {
      nextPlayTimeRef.current = outputCtxRef.current.currentTime;
    }
    isPlayingAudioRef.current = false;
    clearTimeout(playEndTimeoutRef.current);
  }

  function sendSetup() {
    const cfg = configRef.current;
    const voiceName = cfg.voice || 'Aoede';
    wsRef.current.send(JSON.stringify({
      setup: {
        model: GEMINI_MODEL,
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } },
          temperature: 0.3,
        },
        systemInstruction: { parts: [{ text: buildSystemPrompt(cfg.langA, cfg.langB) }] },
        outputAudioTranscription: {},
        inputAudioTranscription: {},
      }
    }));
  }

  function handleServerMessage(text, resolveSetup, rejectSetup) {
    let msg;
    try { msg = JSON.parse(text); } catch (e) { return; }
    if (msg.error) {
      const errMsg = msg.error.message || 'Erro da API Gemini';
      // #region agent log
      DEBUG_LOG('index.html:handleServerMessage', 'API error', { errMsg, status: statusRef.current }, 'C');
      // #endregion
      setError(errMsg);
      if (rejectSetup) rejectSetup(new Error(errMsg));
      return;
    }
    if (msg.setupComplete !== undefined) {
      if (resolveSetup) resolveSetup();
      return;
    }
    const sc = msg.serverContent;
    if (!sc) return;
    if (sc.modelTurn?.parts) {
      for (const part of sc.modelTurn.parts) {
        if (part.inlineData?.mimeType?.startsWith('audio/pcm') && part.inlineData.data) {
          playAudioChunk(part.inlineData.data);
        }
      }
    }
    if (sc.inputTranscription?.text) {
      appendInputTranscription(sc.inputTranscription.text);
    }
    if (sc.outputTranscription?.text) {
      appendOutputTranscription(sc.outputTranscription.text);
    }
    if (sc.turnComplete) {
      if (searchModeRef.current && searchUtteranceBufRef.current.trim()) {
        const utterance = searchUtteranceBufRef.current.trim();
        searchUtteranceBufRef.current = '';
        inputAccumRef.current = false;
        const cb = searchOnUtteranceRef.current;
        if (cb) cb(utterance);
      } else {
        inputAccumRef.current = false;
        outputAccumRef.current = false;
        outputTargetRef.current = null;
      }
    }
    if (sc.interrupted) {
      interruptPlayback();
      outputAccumRef.current = false;
      outputTargetRef.current = null;
    }
  }

  function connectWebSocket(apiKey) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const timeout = setTimeout(() => {
        if (!settled) { settled = true; reject(new Error('Tempo esgotado ao conectar. Verifique sua API key e internet.')); }
      }, 15000);
      const ok = (v) => { if (!settled) { settled = true; clearTimeout(timeout); resolve(v); } };
      const fail = (e) => { if (!settled) { settled = true; clearTimeout(timeout); reject(e); } };

      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(apiKey)}`;
      const ws = new WebSocket(url);
      wsRef.current = ws;
      ws.onopen = () => sendSetup();
      ws.onmessage = async (e) => {
        const t = e.data instanceof Blob ? await e.data.text() : e.data;
        handleServerMessage(t, ok, fail);
      };
      ws.onerror = () => fail(new Error('Erro de conexão com a API'));
      ws.onclose = (ev) => {
        // #region agent log
        DEBUG_LOG('index.html:ws.onclose', 'WebSocket closed', {
          code: ev.code, reason: ev.reason, status: statusRef.current, reconnect: reconnectRef.current,
        }, 'C');
        // #endregion
        if (!settled) {
          fail(new Error(ev.reason || 'Conexão fechada antes de completar setup'));
          return;
        }
        if (statusRef.current === 'active' || pausedRef.current) {
          scheduleReconnect();
        }
      };
    });
  }

  function scheduleReconnect() {
    reconnectRef.current++;
    if (reconnectRef.current > 5) {
      setError('Não foi possível reconectar. Verifique a internet.');
      stop();
      return;
    }
    setStatus('reconnecting');
    const delay = Math.min(1000 * reconnectRef.current, 5000);
    setTimeout(async () => {
      try {
        const apiKey = APP_CONFIG.DEFAULT_API_KEY || localStorage.getItem('gemini_api_key');
        await connectWebSocket(apiKey);
        setStatus('active');
        reconnectRef.current = 0;
      } catch (e) { scheduleReconnect(); }
    }, delay);
  }

  async function resumeAudioContexts() {
    for (const ctx of [inputCtxRef.current, outputCtxRef.current]) {
      if (ctx && ctx.state === 'suspended') await ctx.resume();
    }
  }

  async function initAudio() {
    inputCtxRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    outputCtxRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    await resumeAudioContexts();
    nextPlayTimeRef.current = outputCtxRef.current.currentTime;

    await inputCtxRef.current.audioWorklet.addModule('mic-worklet.js');
    micStreamRef.current = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
      }
    });

    const source = inputCtxRef.current.createMediaStreamSource(micStreamRef.current);
    workletRef.current = new AudioWorkletNode(inputCtxRef.current, 'mic-processor');
    workletRef.current.port.onmessage = (e) => {
      if (pausedRef.current || !micOnRef.current) return;
      if (!wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) return;
      const b64 = arrayBufferToBase64(e.data);
      wsRef.current.send(JSON.stringify({
        realtimeInput: {
          audio: { mimeType: 'audio/pcm;rate=16000', data: b64 }
        }
      }));
    };
    source.connect(workletRef.current);
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try { wakeLockRef.current = await navigator.wakeLock.request('screen'); }
    catch (e) {}
  }

  function startTimer() {
    startTimeRef.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => {
      const secs = Math.floor((Date.now() - startTimeRef.current) / 1000);
      setElapsed(secs);
      if (secs > 0 && secs % 300 === 0) {
        // #region agent log
        DEBUG_LOG('index.html:sessionTimer', 'Session health', {
          elapsedSecs: secs,
          transA: transLenRef.current.A,
          transB: transLenRef.current.B,
          wsOpen: wsRef.current?.readyState === 1,
        }, 'B');
        // #endregion
      }
    }, 1000);
  }
  function stopTimer() {
    clearInterval(timerRef.current);
    timerRef.current = null;
  }

  async function start(config) {
    if (statusRef.current !== 'idle') return false;
    configRef.current = config;
    const apiKey = APP_CONFIG.DEFAULT_API_KEY || localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      setError('Falta a API key (config.js).');
      return false;
    }
    setError(null);
    setTransA([]); setTransB([]);
    transLenRef.current = { A: 0, B: 0 };
    resetTranscriptionState();
    searchModeRef.current = false;
    searchOnUtteranceRef.current = null;
    searchUtteranceBufRef.current = '';
    setAudioOn(config.audio !== false);
    setMicOn(true);
    setPaused(false);
    setStatus('connecting');
    try {
      await initAudio();
      await connectWebSocket(apiKey);
      setStatus('active');
      startTimer();
      await requestWakeLock();
      // #region agent log
      DEBUG_LOG('index.html:start', 'Session started', { langA: config.langA, langB: config.langB, model: GEMINI_MODEL }, 'C');
      // #endregion
      return true;
    } catch (e) {
      // #region agent log
      DEBUG_LOG('index.html:start', 'Session start failed', { error: e.message }, 'C');
      // #endregion
      setError('Erro ao iniciar: ' + e.message);
      setStatus('error');
      stop();
      return false;
    }
  }

  function stop() {
    setStatus('idle');
    setPaused(false);
    if (wsRef.current) { try { wsRef.current.close(); } catch(e){} wsRef.current = null; }
    if (workletRef.current) { workletRef.current.disconnect(); workletRef.current = null; }
    if (micStreamRef.current) { micStreamRef.current.getTracks().forEach(t => t.stop()); micStreamRef.current = null; }
    if (inputCtxRef.current) { inputCtxRef.current.close(); inputCtxRef.current = null; }
    if (outputCtxRef.current) { outputCtxRef.current.close(); outputCtxRef.current = null; }
    if (wakeLockRef.current) { wakeLockRef.current.release(); wakeLockRef.current = null; }
    stopTimer();
    reconnectRef.current = 0;
  }

  function pause() { setPaused(true); }
  function resume() {
    setPaused(false);
    resumeAudioContexts();
  }
  function toggleAudio() {
    setAudioOn(v => {
      const next = !v;
      if (!next) interruptPlayback();
      else resumeAudioContexts();
      return next;
    });
  }
  async function toggleMic() {
    setMicOn(v => {
      const next = !v;
      if (next) resumeAudioContexts();
      return next;
    });
  }

  function sendText(text) {
    if (searchModeRef.current) return;
    if (!text || !text.trim()) return;
    if (!wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) {
      setError('Sem conexão. Aguarde reconectar ou reinicie a sessão.');
      return;
    }
    const t = text.trim();
    beginNewTurn();
    appendInputTranscription(t, { skipBeginTurn: true });
    wsRef.current.send(JSON.stringify({
      clientContent: {
        turns: [{ role: 'user', parts: [{ text: t }] }],
        turnComplete: true,
      },
    }));
  }

  function addSearchResult(text, langId) {
    if (!text || !text.trim()) return;
    const cfg = configRef.current;
    if (!cfg) return;
    const a = langById(cfg.langA), b = langById(cfg.langB);
    if (!a || !b) return;
    const lang = langById(langId);
    const base = lang?.base;
    const target = base === a.base ? 'A' : 'B';
    const entry = { text: text.trim(), isOutput: true };
    const setter = target === 'A' ? setTransA : setTransB;
    setter(prev => {
      const next = [...prev, entry];
      const capped = next.length > MAX_TRANSLATIONS ? next.slice(-MAX_TRANSLATIONS) : next;
      transLenRef.current[target] = capped.length;
      return capped;
    });
  }

  return {
    status, paused, audioOn, micOn, elapsed, error,
    transA, transB,
    start, stop, pause, resume, toggleAudio, toggleMic, sendText, addSearchResult, setSearchMode, resumeAudioContexts,
  };
}

// ==========================================
// SMALL COMPONENTS
// ==========================================
function LangCard({ lang, selected, onSelect, theme }) {
  return (
    <button onClick={onSelect} style={{
      display: 'flex', alignItems: 'center', gap: 8,
      padding: '11px 10px', width: '100%',
      background: selected ? theme.selBg(lang.color) : theme.cardBg,
      border: selected ? theme.selBorder(lang.color) : (theme.cardBorder || `1px solid ${theme.divider}`),
      borderRadius: theme.radius, cursor: 'pointer',
      boxShadow: selected ? 'none' : theme.cardShadow,
      transition: 'all 0.15s ease', fontFamily: theme.font, outline: 'none',
    }}>
      <span style={{ fontSize: 22, lineHeight: 1 }}>{lang.flag}</span>
      <span style={{
        fontSize: 13, fontWeight: selected ? 600 : 400,
        color: selected ? lang.color : theme.text, whiteSpace: 'nowrap',
      }}>{lang.label}</span>
      {selected && (
        <svg width="15" height="15" viewBox="0 0 16 16" style={{ marginLeft: 'auto', flexShrink: 0 }}>
          <circle cx="8" cy="8" r="8" fill={lang.color} />
          <path d="M5 8l2 2 4-4" stroke="#fff" strokeWidth="1.5" fill="none"
                strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      )}
    </button>
  );
}

function IOSToggle({ value, onChange, theme }) {
  return (
    <button onClick={() => onChange(!value)} style={{
      width: 51, height: 31, borderRadius: 16, border: 'none', cursor: 'pointer',
      background: value ? theme.success : '#E5E5EA', position: 'relative',
      transition: 'background 0.2s ease', padding: 0, flexShrink: 0,
    }}>
      <div style={{
        width: 27, height: 27, borderRadius: '50%', background: '#FFF',
        position: 'absolute', top: 2, left: value ? 22 : 2,
        transition: 'left 0.2s ease',
        boxShadow: '0 1px 3px rgba(0,0,0,0.15)',
      }} />
    </button>
  );
}

function OptionRow({ label, children, theme }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '13px 16px', background: theme.cardBg, borderRadius: theme.radius,
      boxShadow: theme.cardShadow, border: theme.cardBorder || 'none',
    }}>
      <span style={{ fontSize: 15, color: theme.text, fontFamily: theme.font }}>{label}</span>
      {children}
    </div>
  );
}

  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{
        fontSize: 12, fontWeight: 700, color: theme.textSec,
        textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8, display: 'block',
      }}>{label}</label>
      <button type="button" onClick={onToggle} style={{
        width: '100%', padding: '16px 18px', borderRadius: theme.radius,
        background: theme.cardBg, border: open ? `2px solid ${sel.color}` : (theme.cardBorder || `1px solid ${theme.divider}`),
        boxShadow: theme.cardShadow, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12,
        fontFamily: theme.font, outline: 'none', textAlign: 'left',
      }}>
        <span style={{ fontSize: 28, lineHeight: 1 }}>{sel.flag}</span>
        <span style={{ flex: 1, fontSize: 18, fontWeight: 600, color: theme.text }}>{sel.label}</span>
        <span style={{ fontSize: 14, color: theme.textSec, transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>▼</span>
      </button>
      {open && (
        <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 6, animation: 'slideUp 0.2s ease' }}>
          {LANGUAGES.map(l => (
            <button key={l.id} type="button" onClick={() => onChange(l.id)} style={{
              width: '100%', padding: '14px 16px', borderRadius: theme.radius,
              background: value === l.id ? theme.selBg(l.color) : theme.cardBg,
              border: value === l.id ? theme.selBorder(l.color) : `1px solid ${theme.divider}`,
              cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12,
              fontFamily: theme.font, outline: 'none', textAlign: 'left',
            }}>
              <span style={{ fontSize: 24 }}>{l.flag}</span>

      )}

}

// ==========================================
// TRANSLATION VIEW (legenda grande estilo)
// ==========================================
function TranslationView({ lang, translations, theme, padTop, padBot, listening }) {
  const lastInIdx = translations.map((t, i) => (!t.isOutput ? i : -1)).filter(i => i >= 0).pop();
  const lastOutIdx = translations.map((t, i) => (t.isOutput ? i : -1)).filter(i => i >= 0).pop();
  let heroIdx = -1;
  if (lastInIdx !== undefined && lastOutIdx !== undefined) {
    heroIdx = lastOutIdx >= lastInIdx ? lastOutIdx : lastInIdx;
  } else if (lastOutIdx !== undefined) heroIdx = lastOutIdx;
  else if (lastInIdx !== undefined) heroIdx = lastInIdx;
  const latest = heroIdx >= 0 ? translations[heroIdx] : null;
  const history = translations.filter((_, i) => i !== heroIdx).slice(-3);

  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      padding: `${padTop || 12}px 18px ${padBot || 12}px`,
      background: theme.halfBg(lang.color),
      overflow: 'hidden', fontFamily: theme.font,
      minHeight: 0,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
        <span style={{ fontSize: 18, lineHeight: 1 }}>{lang.flag}</span>
        <span style={{
          fontSize: 11, fontWeight: 700, color: lang.color,
          textTransform: 'uppercase', letterSpacing: 0.8,
        }}>{lang.label}</span>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 5 }}>
          <div style={{
            width: 6, height: 6, borderRadius: '50%',
            background: listening ? theme.success : '#C0C0C0',
            boxShadow: listening ? `0 0 6px ${theme.success}80` : 'none',
            animation: listening ? 'pulse 2s infinite' : 'none',
          }} />
          <span style={{ fontSize: 10, color: theme.textSec }}>
            {listening ? 'Ouvindo' : 'Pausado'}
          </span>
        </div>
      </div>

      <div style={{
        flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
        minHeight: 0, padding: '8px 0',
      }}>
        {latest ? (
          <div key={translations.length} style={{
            textAlign: 'center', animation: 'slideUp 0.3s ease',
          }}>
            <p style={{
              fontSize: 28, fontWeight: 600, color: theme.text,
              lineHeight: 1.22, margin: 0,
              textWrap: 'balance', letterSpacing: -0.3,
              opacity: latest.isOutput ? 1 : 0.88,
            }}>{latest.text}</p>
          </div>
        ) : (
          <p style={{
            fontSize: 14, color: theme.textTer, margin: 0, textAlign: 'center',
          }}>Aguardando tradução…</p>
        )}
      </div>

      {history.length > 0 && (
        <div style={{
          flexShrink: 0, display: 'flex', flexDirection: 'column',
          borderTop: `1px solid ${theme.divider}`,
          paddingTop: 6,
        }}>
          {history.map((t, i, arr) => {
            const opacity = 0.18 + (i / Math.max(arr.length - 1, 1)) * 0.25;
            return (
              <p key={i + '-' + t.text.slice(0, 8)} style={{
                fontSize: 12, color: theme.text, opacity,
                margin: '1px 0', lineHeight: 1.3, textAlign: 'center',
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{t.text}</p>
            );
          })}
        </div>
      )}
    </div>
  );
}

// SETUP SCREEN
// ==========================================
function SetupScreen({ onStart, theme, error, starting }) {
  const [langA, setLangA] = React.useState(() => localStorage.getItem('lang_a') || 'pt-BR');
  const [langB, setLangB] = React.useState(() => localStorage.getItem('lang_b') || 'en-US');
  const [openPicker, setOpenPicker] = React.useState(null);
  const [audio, setAudio] = React.useState(true);
  const [voiceGender, setVoiceGender] = React.useState(() => {
    const v = localStorage.getItem('voice');
    return v === VOICE_BY_GENDER.M.id ? 'M' : 'F';
  });
  const [voiceBusy, setVoiceBusy] = React.useState(null);
  const [voiceErr, setVoiceErr] = React.useState(null);
  const [restSecs, setRestSecs] = React.useState(() => parseInt(localStorage.getItem('restSecs')) || 60);

  const voice = voiceGender === 'M' ? VOICE_BY_GENDER.M.id : VOICE_BY_GENDER.F.id;

  React.useEffect(() => { localStorage.setItem('lang_a', langA); }, [langA]);
  React.useEffect(() => { localStorage.setItem('lang_b', langB); }, [langB]);
  React.useEffect(() => { localStorage.setItem('voice', voice); }, [voice]);
  React.useEffect(() => { localStorage.setItem('restSecs', restSecs); }, [restSecs]);

  const sameLang = langA === langB;

  async function pickVoice(gender) {
    setVoiceGender(gender);
    setVoiceErr(null);
    setVoiceBusy(gender);
    try {
      await playVoiceSample(VOICE_BY_GENDER[gender].id, langA);
    } catch (e) {
      setVoiceErr(e.message);
    }
    setVoiceBusy(null);
  }

  return (
    
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      padding: '20px 20px 24px', background: theme.bg,
      fontFamily: theme.font, overflow: 'auto',
    }}>
      <div style={{ textAlign: 'center', marginBottom: 20, paddingTop: 4 }}>
        <img src="logo.png" alt="Will Translator" style={{ width: 130, height: 'auto' }} />
      </div>

      <LangPicker label="Eu falo" value={langA} theme={theme}
        open={openPicker === 'a'}
        onToggle={() => setOpenPicker(openPicker === 'a' ? null : 'a')}
        onChange={(id) => { setLangA(id); setOpenPicker(null); }} />

      <LangPicker label="Outra pessoa fala" value={langB} theme={theme}
        open={openPicker === 'b'}
        onToggle={() => setOpenPicker(openPicker === 'b' ? null : 'b')}
        onChange={(id) => { setLangB(id); setOpenPicker(null); }} />

      <OptionRow label="Traduzir em áudio" theme={theme}>
        <IOSToggle value={audio} onChange={setAudio} theme={theme} />
      </OptionRow>

      <OptionRow label="Descanso (seg)" theme={theme}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
          {[30, 45, 60, 90, 120].map(s => (
            <button key={s} type="button" onClick={() => setRestSecs(s)} style={{
              padding: '6px 11px', borderRadius: 8,
              background: restSecs === s ? theme.primary : theme.cardBg,
              color: restSecs === s ? '#fff' : theme.text,
              border: restSecs === s ? 'none' : `1px solid ${theme.divider}`,
              fontSize: 13, fontWeight: restSecs === s ? 600 : 400,
              cursor: 'pointer', fontFamily: theme.font,
            }}>{s}</button>
          ))}
        </div>
      </OptionRow>

      {audio && (
        <>
          <label style={{
            fontSize: 12, fontWeight: 700, color: theme.textSec,
            textTransform: 'uppercase', letterSpacing: 0.8, marginTop: 14, marginBottom: 8, display: 'block',
          }}>Voz da tradução</label>
          <p style={{ fontSize: 12, color: theme.textSec, margin: '0 0 10px' }}>
            Toque para ouvir e escolher
          </p>
          {['F', 'M'].map(g => {
            const info = VOICE_BY_GENDER[g];
            const selected = voiceGender === g;
            const busy = voiceBusy === g;
            return (
              <button key={g} type="button" onClick={() => pickVoice(g)} disabled={!!voiceBusy} style={{
                width: '100%', padding: '16px 18px', marginBottom: 8, borderRadius: theme.radius,
                background: selected ? theme.primary + '14' : theme.cardBg,
                border: selected ? `2px solid ${theme.primary}` : (theme.cardBorder || `1px solid ${theme.divider}`),
                cursor: voiceBusy ? 'wait' : 'pointer', display: 'flex', alignItems: 'center', gap: 12,
                fontFamily: theme.font, outline: 'none', textAlign: 'left', opacity: voiceBusy && !busy ? 0.5 : 1,
              }}>
                <span style={{
                  width: 40, height: 40, borderRadius: '50%', flexShrink: 0,
                  background: g === 'F' ? '#E91E8C18' : '#2563EB18',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 20,
                }}>{g === 'F' ? '♀' : '♂'}</span>
                <span style={{ flex: 1 }}>
                  <span style={{ display: 'block', fontSize: 17, fontWeight: 600, color: theme.text }}>{info.label}</span>
                  <span style={{ display: 'block', fontSize: 12, color: theme.textSec, marginTop: 2 }}>
                    {busy ? 'Ouvindo amostra…' : 'Toque para ouvir'}
                  </span>
                </span>
                <span style={{ fontSize: 22 }}>{busy ? '…' : '🔊'}</span>
              </button>
            );
          })}
          {voiceErr && (
            <p style={{ fontSize: 12, color: theme.danger, margin: '4px 0 0' }}>{voiceErr}</p>
          )}
        </>
      )}

      {sameLang && (
        <div style={{
          marginTop: 12, padding: '10px 14px', background: '#FFF3CD', color: '#856404',
          borderRadius: theme.radius, fontSize: 13,
        }}>Os dois idiomas precisam ser diferentes.</div>
      )}

      {error && (
        <div style={{
          marginTop: 12, padding: '10px 14px', background: '#FFE0E0', color: theme.danger,
          borderRadius: theme.radius, fontSize: 13,
        }}>{error}</div>
      )}

      
      <button
        type="button"
        onClick={() => !sameLang && !starting && onStart({ langA, langB, audio, voice, restSecs })}
        disabled={sameLang || starting}
        style={{
          width: '100%', padding: '17px', borderRadius: theme.radius, marginTop: 20,
          background: (sameLang || starting) ? theme.textTer : theme.primary,
          color: '#FFF', border: 'none', fontSize: 17, fontWeight: 600,
          cursor: (sameLang || starting) ? 'not-allowed' : 'pointer', fontFamily: theme.font,
          boxShadow: (sameLang || starting) ? 'none' : `0 4px 14px ${theme.primary}40`,
        }}>{starting ? 'Conectando...' : 'Iniciar Sessão'}</button>
    </div>
  );
}

function fmtTime(secs) {
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function ActiveScreen({ config, theme, translator, onEnd }) {
  const [restLeft, setRestLeft] = React.useState(null);
  const [searchMode, setSearchMode] = React.useState(false);
  const [searchLoading, setSearchLoading] = React.useState(false);
  const [typedText, setTypedText] = React.useState('');
  const [layout, setLayout] = React.useState(() => localStorage.getItem('layout') || 'vertical');
  const [showLayoutMenu, setShowLayoutMenu] = React.useState(false);

  const runSearchRef = React.useRef(null);

  React.useEffect(() => { localStorage.setItem('layout', layout); }, [layout]);

  React.useEffect(() => {
    if (restLeft === null) return;
    if (restLeft === 0) {
      if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      const t = setTimeout(() => setRestLeft(null), 2500);
      return () => clearTimeout(t);
    }
    const id = setInterval(() => setRestLeft(s => (s <= 1 ? 0 : s - 1)), 1000);
    return () => clearInterval(id);
  }, [restLeft]);

  const runSearch = React.useCallback(async (rawText) => {
    if (!rawText || !rawText.trim()) return;
    setSearchLoading(true);
    translatorRef.current.setSearchMode(false, null);
    setSearchMode(false);
    try {
      const { query, langId } = parseSearchRequest(rawText, config, config.langA);
      if (query) {
        const ans = await searchInternet(query, langId);
        translatorRef.current.addSearchResult?.(ans, langId);
        await speakSearchResult(ans, config.voice || 'Aoede');
      }
    } catch (e) { /* silencioso */ }
    setSearchLoading(false);
  }, [config]);

  runSearchRef.current = runSearch;

  const translatorRef = React.useRef(translator);
  translatorRef.current = translator;

  React.useEffect(() => {
    translatorRef.current.setSearchMode(searchMode, (utterance) => {
      runSearchRef.current?.(utterance);
    });
    return () => translatorRef.current.setSearchMode(false, null);
  }, [searchMode]);

  function startRest() {
    DEBUG_LOG('index.html:startRest', 'Rest timer started', { secs: config.restSecs || 60 }, 'E');
    setRestLeft(config.restSecs || 60);
  }

  function cancelRest() {
    setRestLeft(null);
  }

  function toggleSearchMode() {
    setSearchMode(on => !on);
  }

  function submitInput() {
    const t = typedText.trim();
    if (!t) return;
    translator.resumeAudioContexts?.();
    if (searchMode) { runSearch(t); setSearchMode(false); }
    else translator.sendText(t);
    setTypedText('');
  }

  const langA = langById(config.langA);
  const langB = langById(config.langB);
  const listening = translator.status === 'active' && !translator.paused && translator.micOn;
  const isVert = layout !== 'horizontal';
  const isRotated = layout === 'vertical';
  const padB = isRotated
    ? { top: 8, bot: 22 }
    : isVert
      ? { top: 10, bot: 10 }
      : { top: 12, bot: 12 };
  const padA = isRotated
    ? { top: 22, bot: 8 }
    : isVert
      ? { top: 10, bot: 10 }
      : { top: 12, bot: 12 };

  const ctrlBtn = (child, opts = {}) => (
    <button type="button" onClick={opts.onClick} title={opts.title} style={{
      width: 40, height: 40, borderRadius: '50%',
      border: `1px solid ${opts.danger ? theme.danger + '40' : opts.active ? theme.primary + '40' : theme.divider}`,
      background: opts.danger ? theme.danger + '12' : opts.active ? theme.primary + '12' : theme.cardBg,
      cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: opts.danger ? theme.danger : opts.active ? theme.primary : theme.textSec,
      outline: 'none', fontSize: 15, flexShrink: 0, fontFamily: theme.font,
    }}>{child}</button>
  );


  return (
    
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      position: 'relative', fontFamily: theme.font, background: theme.bg,
    }}>
      {(translator.error || translator.status === 'reconnecting') && (
        <div style={{
          flexShrink: 0, padding: '10px 14px', background: theme.danger + '18',
          color: theme.danger, fontSize: 13, fontWeight: 600, textAlign: 'center',
          borderBottom: `1px solid ${theme.danger}40`,
        }}>
          {translator.status === 'reconnecting' ? 'Reconectando…' : translator.error}
        </div>
      )}
      {restLeft !== null && (
        <div style={{
          position: 'absolute', top: 10, right: 12, zIndex: 60,
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '8px 12px', borderRadius: 24,
          background: restLeft <= 0 ? theme.success : 'rgba(0,0,0,0.78)',
          boxShadow: '0 2px 12px rgba(0,0,0,0.2)',
        }}>
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.75)', textTransform: 'uppercase', letterSpacing: 0.6 }}>
            {restLeft <= 0 ? 'Pronto' : 'Descanso'}
          </span>
          <span style={{
            fontSize: 20, fontWeight: 600, color: '#fff',
            fontVariantNumeric: 'tabular-nums', minWidth: 52, textAlign: 'center',
          }}>{restLeft <= 0 ? '00:00' : fmtTime(restLeft)}</span>
          {restLeft > 0 && (
            <button type="button" onClick={cancelRest} aria-label="Parar cronômetro" style={{
              width: 28, height: 28, borderRadius: '50%', border: 'none',
              background: 'rgba(255,255,255,0.2)', color: '#fff', fontSize: 16,
              cursor: 'pointer', lineHeight: 1, fontFamily: theme.font,
            }}>×</button>
          )}
        </div>
      )}

      {translator.paused && (
        <PausedOverlay
          elapsed={translator.elapsed}
          msgCount={translator.transA.length + translator.transB.length}
          onResume={translator.resume}
          onEnd={onEnd}
          theme={theme} />
      )}

      <div style={{
        flex: '1 1 0%', display: 'flex',
        flexDirection: isVert ? 'column' : 'row',
        overflow: 'hidden', minHeight: 0,
      }}>
        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          transform: isRotated ? 'rotate(180deg)' : 'none',
          overflow: 'hidden', minHeight: 0, minWidth: 0,
          borderBottom: isVert ? `1px solid ${theme.divider}` : 'none',
          borderRight: !isVert ? `1px solid ${theme.divider}` : 'none',
        }}>
          <TranslationView lang={langB} translations={translator.transB} theme={theme}
            padTop={padB.top} padBot={padB.bot} listening={listening} />
        </div>
        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          overflow: 'hidden', minHeight: 0, minWidth: 0,
        }}>
          <TranslationView lang={langA} translations={translator.transA} theme={theme}
            padTop={padA.top} padBot={padA.bot} listening={listening} />
        </div>
      </div>

      {showLayoutMenu && (
        <div style={{
          position: 'absolute', bottom: 118, left: '50%',
          transform: 'translateX(-50%)',
          background: theme.cardBg, borderRadius: theme.radius,
          boxShadow: '0 6px 24px rgba(0,0,0,0.18)',
          border: `1px solid ${theme.divider}`,
          padding: 6, zIndex: 55, width: 210,
          display: 'flex', flexDirection: 'column', gap: 2,
        }}>
          <div style={{
            fontSize: 10, fontWeight: 700, color: theme.textSec,
            padding: '6px 10px 4px', letterSpacing: 0.6, textTransform: 'uppercase',
          }}>Visualização</div>
          {[
            { v: 'vertical', l: 'Frente a frente', hint: 'Um de cabeça para baixo' },
            { v: 'same', l: 'Mesmo lado', hint: 'Os dois em cima e embaixo' },
            { v: 'horizontal', l: 'Lado a lado', hint: 'Dividido na horizontal' },
          ].map(opt => (
            <button key={opt.v} type="button"
              onClick={() => { setLayout(opt.v); setShowLayoutMenu(false); }}
              style={{
                padding: '10px 12px', textAlign: 'left',
                background: layout === opt.v ? theme.primary + '12' : 'transparent',
                color: layout === opt.v ? theme.primary : theme.text,
                border: 'none', borderRadius: 8, cursor: 'pointer',
                fontSize: 14, fontFamily: theme.font,
                fontWeight: layout === opt.v ? 600 : 400,
              }}>
              <span style={{ display: 'block' }}>{opt.l}</span>
              <span style={{ fontSize: 11, color: theme.textSec, fontWeight: 400 }}>{opt.hint}</span>
            </button>
          ))}
        </div>
      )}

      {(searchMode || searchLoading) && (
        <div style={{
          flexShrink: 0, padding: '6px 14px',
          background: '#FFF8F0', borderTop: `1px solid #FF950040`,
          fontSize: 12, color: '#C2410C', fontWeight: 600, textAlign: 'center',
        }}>
          {searchLoading ? '🔎 Buscando…' : '🎙 Aguardando pergunta…'}
        </div>
      )}

      <div style={{
        padding: '10px 16px 8px', borderTop: `1px solid ${theme.divider}`,
        background: theme.bg, flexShrink: 0,
      }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <input
            type="text"
            value={typedText}
            onChange={e => setTypedText(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') submitInput(); }}
            placeholder={searchMode ? 'Fale no mic ou digite sua pergunta...' : 'Digite para traduzir...'}
            style={{
              flex: 1, padding: '12px 14px', borderRadius: theme.radius,
              border: `1px solid ${theme.divider}`, background: theme.cardBg,
              color: theme.text, fontSize: 16, outline: 'none', fontFamily: theme.font,
            }}
          />
          <button type="button" onClick={submitInput} disabled={!typedText.trim() || searchLoading} style={{
            padding: '12px 16px', borderRadius: theme.radius,
            background: typedText.trim() && !searchLoading ? (searchMode ? '#FF9500' : theme.primary) : theme.textTer,
            color: '#FFF', border: 'none', fontSize: 15, fontWeight: 600,
            cursor: typedText.trim() && !searchLoading ? 'pointer' : 'not-allowed', fontFamily: theme.font,
          }}>{searchMode ? (searchLoading ? '...' : 'Buscar') : 'Enviar'}</button>
        </div>
      </div>

      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 20,
        padding: '10px 16px 6px', flexShrink: 0,
      }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <button type="button" onClick={toggleSearchMode} style={{
            width: 64, height: 64, borderRadius: '50%', border: 'none', cursor: 'pointer',
            background: (searchMode || searchLoading)
              ? '#FF9500'
              : 'linear-gradient(135deg, #FF9500, #FF6B00)',
            color: '#FFF', fontSize: 26, fontWeight: 700,
            boxShadow: (searchMode || searchLoading)
              ? '0 0 0 4px #FF950055, 0 4px 16px #FF950066'
              : '0 4px 14px #FF950055',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transform: (searchMode || searchLoading) ? 'scale(1.08)' : 'scale(1)',
            transition: 'all 0.18s ease',
          }}>{searchLoading ? '…' : '?'}</button>
          <span style={{ fontSize: 10, color: theme.textSec, fontWeight: 600 }}>PERGUNTA</span>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <button type="button" onClick={startRest} style={{
            width: 64, height: 64, borderRadius: '50%', border: 'none', cursor: 'pointer',
            background: 'linear-gradient(135deg, #5856D6, #3634A3)',
            color: '#FFF', fontSize: 26,
            boxShadow: '0 4px 14px #5856D655',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>⏱</button>
          <span style={{ fontSize: 10, color: theme.textSec, fontWeight: 600 }}>DESCANSO</span>
        </div>
      </div>

      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
        padding: '6px 16px 14px', flexShrink: 0,
      }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: theme.textSec, fontVariantNumeric: 'tabular-nums', minWidth: 42 }}>
          {fmtTime(translator.elapsed)}
        </span>
        {ctrlBtn(
          translator.micOn ? <MicIcon size={14} /> : <MicMutedIcon size={14} />,
          { onClick: translator.toggleMic, active: translator.micOn, title: 'Microfone' }
        )}
        {ctrlBtn(translator.audioOn ? '🔊' : '🔇', {
          onClick: translator.toggleAudio, active: translator.audioOn, title: 'Áudio',
        })}
        {ctrlBtn(
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="12" height="5" rx="1" stroke="currentColor" strokeWidth="1.2"/>
            <rect x="1" y="8" width="12" height="5" rx="1" stroke="currentColor" strokeWidth="1.2"/>
          </svg>,
          { onClick: () => setShowLayoutMenu(v => !v), active: showLayoutMenu, title: 'Visualização' }
        )}
        {ctrlBtn('⏸', { onClick: translator.pause, title: 'Pausar' })}
        {ctrlBtn('⏹', { onClick: onEnd, danger: true, title: 'Encerrar' })}
      </div>
    </div>
  );
}


// ==========================================
// PAUSED OVERLAY
// ==========================================
function PausedOverlay({ elapsed, msgCount, onResume, onEnd, theme }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.55)',
      backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 12,
      fontFamily: theme.font, animation: 'fadeIn 0.2s ease',
    }}>
      <div style={{
        width: 56, height: 56, borderRadius: '50%',
        background: 'rgba(255,255,255,0.12)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        marginBottom: 4,
      }}>
        <svg width="22" height="26" viewBox="0 0 12 14" fill="none">
          <rect x="1" y="1" width="4" height="12" rx="1" fill="#FFF"/>
          <rect x="7" y="1" width="4" height="12" rx="1" fill="#FFF"/>
        </svg>
      </div>
      <span style={{ fontSize: 20, fontWeight: 600, color: '#FFF' }}>Sessão Pausada</span>
      <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)' }}>
        {fmtTime(elapsed)} · {msgCount} {msgCount === 1 ? 'mensagem' : 'mensagens'}
      </span>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 200, marginTop: 8 }}>
        <button onClick={onResume} style={{
          padding: '15px', borderRadius: theme.radius, width: '100%',
          background: theme.primary, color: '#FFF', border: 'none',
          fontSize: 16, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>Retomar</button>
        <button onClick={onEnd} style={{
          padding: '15px', borderRadius: theme.radius, width: '100%',
          background: 'rgba(255,255,255,0.1)', color: '#FFF',
          border: '1px solid rgba(255,255,255,0.2)',
          fontSize: 16, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>Encerrar</button>
      </div>
    </div>
  );
}

// ==========================================
// END SCREEN
// ==========================================
function EndScreen({ elapsed, msgCount, history, onNew, theme }) {
  const [copied, setCopied] = React.useState(false);

  const exportHistory = () => {
    if (!history || history.length === 0) return;
    const lines = history.map(h => `[${h.isOutput ? 'Tradução' : 'Original'}] ${h.text}`);
    const txt = `Sessão Tradutor Will — ${fmtTime(elapsed)}\n\n${lines.join('\n')}`;
    navigator.clipboard.writeText(txt).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {});
  };

  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '40px 32px', background: theme.bg,
      fontFamily: theme.font, gap: 4, minHeight: '100%',
    }}>
      <div style={{
        width: 60, height: 60, borderRadius: '50%',
        background: theme.success + '15',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        marginBottom: 8,
      }}>
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M6 14l6 6 10-10" stroke={theme.success} strokeWidth="2.5"
                strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: theme.text, margin: 0 }}>
        Sessão Encerrada
      </h2>
      <p style={{ fontSize: 15, color: theme.textSec, margin: '2px 0 0' }}>
        Duração: {fmtTime(elapsed)}
      </p>
      <p style={{ fontSize: 15, color: theme.textSec, margin: '2px 0 24px' }}>
        {msgCount} {msgCount === 1 ? 'mensagem traduzida' : 'mensagens traduzidas'}
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 220 }}>
        {history && history.length > 0 && (
          <button onClick={exportHistory} style={{
            padding: '14px', borderRadius: theme.radius,
            background: theme.cardBg, color: theme.text,
            border: `1px solid ${theme.divider}`,
            fontSize: 15, fontWeight: 500, cursor: 'pointer', fontFamily: theme.font,
            boxShadow: theme.cardShadow,
          }}>{copied ? 'Copiado!' : 'Copiar Histórico'}</button>
        )}
        <button onClick={onNew} style={{
          padding: '16px', borderRadius: theme.radius,
          background: theme.primary, color: '#FFF', border: 'none',
          fontSize: 17, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>Nova Sessão</button>
      </div>
    </div>
  );
}

// ==========================================
// SPLASH SCREEN
// ==========================================
function SplashScreen({ onDone }) {
  const videoRef = React.useRef(null);
  const [fadeOut, setFadeOut] = React.useState(false);

  React.useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const finish = () => { setFadeOut(true); setTimeout(onDone, 450); };
    v.addEventListener('ended', finish);
    v.play().catch(() => setTimeout(finish, 800));
    const fallback = setTimeout(finish, 3500);
    return () => { v.removeEventListener('ended', finish); clearTimeout(fallback); };
  }, []);

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      background: '#FFFFFF',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      opacity: fadeOut ? 0 : 1,
      transition: 'opacity 0.45s ease-out',
    }}>
      <video
        ref={videoRef}
        muted
        playsInline
        preload="auto"
        style={{ width: '65vmin', height: '65vmin', objectFit: 'contain' }}
      >
        <source src="splash.webm" type="video/webm" />
        <source src="splash.mp4" type="video/mp4" />
      </video>
    </div>
  );
}

// ==========================================
// MAIN APP
// ==========================================
function TradutorApp() {
  const [splash, setSplash] = React.useState(true);
  const [screen, setScreen] = React.useState('setup');
  const [config, setConfig] = React.useState(null);
  const [endStats, setEndStats] = React.useState({ elapsed: 0, msgCount: 0, history: [] });
  const theme = getAppTheme('soft');
  const translator = useTranslator();

  React.useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }, []);

  const handleStart = async (cfg) => {
    setConfig(cfg);
    const ok = await translator.start(cfg);
    if (ok) setScreen('active');
  };

  const handleEnd = () => {
    setEndStats({
      elapsed: translator.elapsed,
      msgCount: translator.transA.length + translator.transB.length,
      history: [...translator.transA, ...translator.transB],
    });
    translator.stop();
    setScreen('end');
  };

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      position: 'relative', overflow: 'hidden',
    }}>
      {splash && <SplashScreen onDone={() => setSplash(false)} />}
      {!splash && screen === 'setup' && (
        <SetupScreen onStart={handleStart} theme={theme} error={translator.error}
          starting={translator.status !== 'idle'} />
      )}
      {!splash && screen === 'active' && config && (
        <ActiveScreen config={config} theme={theme} translator={translator} onEnd={handleEnd} />
      )}
      {!splash && screen === 'end' && (
        <EndScreen
          elapsed={endStats.elapsed}
          msgCount={endStats.msgCount}
          history={endStats.history}
          onNew={() => setScreen('setup')}
          theme={theme} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TradutorApp />);
  </script>
</body>
</html>
