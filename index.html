<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tradutor Will" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>Tradutor Will</title>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <script src="tts.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #F2F2F7;
      font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    button { font-family: inherit; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
// ============================================================
// TRADUTOR WILL — frontend (PWA)
// ============================================================
// Intérprete PT-BR ↔ EN-GB para aula de personal trainer.
// Arquitetura: UMA fala → UMA requisição POST /api/translate no
// backend → UMA tradução → descarta contexto. Não há WebSocket,
// não há sessão contínua, não há chave de API neste código.
// ============================================================

const LANGS = {
  'pt-BR': { id: 'pt-BR', label: 'Português', short: 'PT', flag: '🇧🇷', color: '#2563EB', base: 'pt' },
  'en-GB': { id: 'en-GB', label: 'English (UK)', short: 'EN', flag: '🇬🇧', color: '#7C3AED', base: 'en' },
};
const langById = (id) => LANGS[id] || LANGS['en-GB'];

// Par de idiomas fixo da sessão (treinador fala PT, aluno fala EN britânico).
const SESSION = { langA: 'pt-BR', langB: 'en-GB' };

const MAX_TRANSLATIONS = 60;      // capa o painel em sessões longas
const MIC_CHUNK_MS = 100;         // chunks de ~100ms do worklet
const COOLDOWN_MS = 700;          // bloqueia o mic logo após a voz do app

// VAD simples baseado em energia (RMS) — roda no thread principal.
const VAD = {
  preRollMs: 600,           // áudio retido antes da voz (ring buffer)
  minSilenceMs: 450,        // silêncio p/ encerrar a fala
  speechStartFrames: 3,     // chunks consecutivos p/ confirmar voz
  minUtteranceMs: 350,      // ignora cliques/interjeições curtíssimas
  maxUtteranceMs: 30000,    // corta falas muito longas
  thresholdRatio: 3.0,      // voz = RMS > pisoDeRuído * ratio
  absFloor: 0.015,          // piso absoluto mínimo
  noiseDecay: 0.97,         // adaptação lenta do piso de ruído
};

const STATUS_LABEL = {
  connecting: 'Conectando…',
  active: 'Ouvindo',
  processing: 'Traduzindo…',
  speaking: 'Falando…',
  cooldown: 'Aguardando…',
  error: 'Erro',
  idle: '…',
};

const THEME = {
  bg: '#F2F2F7', cardBg: '#FFFFFF',
  text: '#1C1C1E', textSec: '#8E8E93', textTer: '#AEAEB2',
  divider: '#E5E5EA', primary: '#007AFF', danger: '#FF3B30', success: '#34C759',
  radius: 14, font: "-apple-system, 'SF Pro Text', system-ui, sans-serif",
  cardBorder: 'none', cardShadow: '0 1px 3px rgba(0,0,0,0.05)',
  halfBg: () => '#FFFFFF',
  selBg: () => '#FFFFFF',
  selBorder: (c) => `2px solid ${c}`,
};

// ============================================================
// ÁUDIO UTILS
// ============================================================
function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

// Int16 PCM mono → WAV (o generateContent do Gemini aceita audio/wav).
function int16ToWavBase64(int16, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const bytesPerSample = 2;
  const dataSize = int16.length * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeAscii = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeAscii(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeAscii(8, 'WAVE');
  writeAscii(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * bytesPerSample, true);
  view.setUint16(32, numChannels * bytesPerSample, true);
  view.setUint16(34, bitsPerSample, true);
  writeAscii(36, 'data');
  view.setUint32(40, dataSize, true);
  let offset = 44;
  for (let i = 0; i < int16.length; i++, offset += 2) {
    view.setInt16(offset, int16[i], true);
  }
  return arrayBufferToBase64(buffer);
}

// ============================================================
// HOOK: useTranslator
// ============================================================
function useTranslator() {
  const [status, setStatus] = React.useState('idle'); // idle | connecting | active | processing | speaking | cooldown | error
  const [paused, setPaused] = React.useState(false);
  const [micOn, setMicOn] = React.useState(true);
  const [audioOn, setAudioOn] = React.useState(true);
  const [elapsed, setElapsed] = React.useState(0);
  const [error, setError] = React.useState(null);
  const [micLevel, setMicLevel] = React.useState(0);
  const [transA, setTransA] = React.useState([]);
  const [transB, setTransB] = React.useState([]);

  const configRef = React.useRef(null);
  const inputCtxRef = React.useRef(null);
  const micStreamRef = React.useRef(null);
  const micTrackRef = React.useRef(null);
  const micSourceRef = React.useRef(null);
  const workletRef = React.useRef(null);
  const scriptProcessorRef = React.useRef(null);
  const micMonitorGainRef = React.useRef(null);
  const wakeLockRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const startTimeRef = React.useRef(null);
  const cooldownTimerRef = React.useRef(null);

  // Refs espelhadas em sincronia com o estado (não via useEffect),
  // para o pipeline de áudio ler valores corretos a cada chunk de 100ms.
  const statusRef = React.useRef('idle');
  const pausedRef = React.useRef(false);
  const audioOnRef = React.useRef(true);
  const micOnRef = React.useRef(true);

  const inputSampleRateRef = React.useRef(16000);
  const inFlightRef = React.useRef(false);
  const transLenRef = React.useRef({ A: 0, B: 0 });
  // Watchdog do microfone: se nenhum chunk de áudio chegar do worklet,
  // o pipeline está morto (contexto suspenso/track sem áudio) — avisa o usuário
  // em vez de ficar preso em "Ouvindo" silenciosamente.
  const lastMicChunkRef = React.useRef(0);
  const micDeadWarnedRef = React.useRef(false);
  const micWatchdogRef = React.useRef(null);
  const micLevelRef = React.useRef(0);
  const micLevelLastSetRef = React.useRef(0);

  // VAD + ring buffer + utterance em andamento.
  const vadRef = React.useRef({ noiseFloor: 0.02, speaking: false, voicedFrames: 0, silenceMs: 0 });
  const ringRef = React.useRef([]);
  const ringMsRef = React.useRef(0);
  const utteranceRef = React.useRef({ chunks: [], ms: 0 });

  function setStatusState(v) { statusRef.current = v; setStatus(v); }
  function setPausedState(v) { pausedRef.current = v; setPaused(v); }
  function setAudioOnState(v) { audioOnRef.current = v; setAudioOn(v); }
  function setMicOnState(v) { micOnRef.current = v; setMicOn(v); }

  React.useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState !== 'visible') return;
      if (statusRef.current !== 'active') return;
      resumeInputContext();
      requestWakeLock();
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  function resetVad() {
    const v = vadRef.current;
    v.speaking = false;
    v.voicedFrames = 0;
    v.silenceMs = 0;
    ringRef.current = [];
    ringMsRef.current = 0;
    utteranceRef.current = { chunks: [], ms: 0 };
  }

  function resumeInputContext() {
    if (inputCtxRef.current && inputCtxRef.current.state === 'suspended') {
      inputCtxRef.current.resume().catch(() => {});
    }
  }

  function micTrackLost() {
    if (statusRef.current === 'idle') return;
    setError('Microfone perdido — encerre e reinicie a sessão.');
  }

  function beginCooldown() {
    if (statusRef.current === 'idle') return;
    setStatusState('cooldown');
    resetVad();
    clearTimeout(cooldownTimerRef.current);
    cooldownTimerRef.current = setTimeout(() => {
      if (statusRef.current === 'cooldown' && !pausedRef.current) setStatusState('active');
    }, COOLDOWN_MS);
  }

  function speakTranslation(text, targetLang) {
    setStatusState('speaking');
    const provider = window.TextToSpeechProvider;
    if (!provider || !provider.supported()) { beginCooldown(); return; }
    const lang = targetLang === 'pt-BR' ? 'pt-BR' : 'en-GB';
    let finished = false;
    const done = () => { if (!finished) { finished = true; beginCooldown(); } };
    // Rede de segurança caso o onend do SpeechSynthesis nunca dispare.
    const safety = setTimeout(done, Math.min(20000, 2500 + text.length * 70));
    provider.speak(text, {
      lang,
      onend: () => { clearTimeout(safety); done(); },
      onerror: () => { clearTimeout(safety); done(); },
    });
  }

  function appendEntry(text, isOutput, side) {
    const t = (text || '').trim();
    if (!t) return;
    const setter = side === 'A' ? setTransA : setTransB;
    setter((prev) => {
      const next = [...prev, { text: t, isOutput, side, ts: Date.now() }];
      const capped = next.length > MAX_TRANSLATIONS ? next.slice(-MAX_TRANSLATIONS) : next;
      transLenRef.current[side] = capped.length;
      return capped;
    });
  }

  function handleTranslation(result, allowSpeak) {
    const sourceBase = (result.sourceLanguage || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
    const inputSide = sourceBase === 'pt' ? 'A' : 'B';
    const outputSide = inputSide === 'A' ? 'B' : 'A';
    const targetLang = outputSide === 'A' ? 'pt-BR' : 'en-GB';

    if (result.transcription) appendEntry(result.transcription, false, inputSide);
    if (result.translatedText) appendEntry(result.translatedText, true, outputSide);

    if (navigator.vibrate) navigator.vibrate(50);

    const shouldSpeak = allowSpeak && result.shouldSpeak !== false && result.translatedText && audioOnRef.current;
    if (shouldSpeak) speakTranslation(result.translatedText, targetLang);
    else beginCooldown();
  }

  async function translateRequest(payload) {
    if (inFlightRef.current) return;
    const cfg = configRef.current;
    if (!cfg) return;
    inFlightRef.current = true;
    setError(null);
    setStatusState('processing');
    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, langA: cfg.langA, langB: cfg.langB }),
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error((data && data.error) || 'Falha ao traduzir. Tente novamente.');
      if (statusRef.current === 'idle') return;
      handleTranslation(data, !pausedRef.current);
    } catch (e) {
      if (statusRef.current === 'idle') return;
      setError(e && e.message ? e.message : 'Falha ao traduzir. Tente novamente.');
      beginCooldown();
    } finally {
      inFlightRef.current = false;
    }
  }

  function finalizeUtterance() {
    const u = utteranceRef.current;
    utteranceRef.current = { chunks: [], ms: 0 };
    const v = vadRef.current;
    v.speaking = false;
    v.voicedFrames = 0;
    v.silenceMs = 0;

    if (!u || u.ms < VAD.minUtteranceMs || !u.chunks.length) return;

    let total = 0;
    for (const c of u.chunks) total += c.length;
    const int16 = new Int16Array(total);
    let off = 0;
    for (const c of u.chunks) { int16.set(c, off); off += c.length; }

    const wavB64 = int16ToWavBase64(int16, inputSampleRateRef.current || 16000);
    translateRequest({ audio: { data: wavB64, mimeType: 'audio/wav' } });
  }

  function handleMicChunk(int16, rms) {
    lastMicChunkRef.current = Date.now();
    if (micDeadWarnedRef.current) {
      // O áudio voltou a fluir: limpa o aviso anterior.
      micDeadWarnedRef.current = false;
      setError(null);
    }
    // Nível de entrada (alimenta o medidor visual, throttled a ~7x/s).
    micLevelRef.current = rms;
    const nowL = Date.now();
    if (nowL - micLevelLastSetRef.current > 150) {
      micLevelLastSetRef.current = nowL;
      setMicLevel(rms);
    }
    if (pausedRef.current || !micOnRef.current) return;
    // Half-duplex: só captura quando está OUVINDO. Durante tradução/fala/cooldown
    // o áudio do microfone é ignorado (a voz do app nunca vira nova tradução).
    if (statusRef.current !== 'active') return;

    const sr = inputSampleRateRef.current || 16000;
    const chunkMs = (int16.length / sr) * 1000;

    // Ring buffer de pré-roll: retém ~600ms antes da voz detectada.
    ringRef.current.push(int16);
    ringMsRef.current += chunkMs;
    while (ringMsRef.current > VAD.preRollMs && ringRef.current.length) {
      const dropped = ringRef.current.shift();
      ringMsRef.current -= (dropped.length / sr) * 1000;
    }

    const v = vadRef.current;
    const threshold = Math.max(v.noiseFloor * VAD.thresholdRatio, VAD.absFloor);
    const voiced = rms > threshold;

    if (!v.speaking) {
      if (voiced) {
        v.voicedFrames++;
        if (v.voicedFrames >= VAD.speechStartFrames) {
          v.speaking = true;
          v.voicedFrames = 0;
          v.silenceMs = 0;
          utteranceRef.current = { chunks: ringRef.current.slice(), ms: ringMsRef.current };
          ringRef.current = [];
          ringMsRef.current = 0;
        }
      } else {
        v.voicedFrames = 0;
        // Adapta o piso de ruído apenas em silêncio.
        v.noiseFloor = v.noiseFloor * VAD.noiseDecay + Math.min(rms, 0.3) * (1 - VAD.noiseDecay);
      }
    } else {
      utteranceRef.current.chunks.push(int16);
      utteranceRef.current.ms += chunkMs;
      if (voiced) {
        v.silenceMs = 0;
      } else {
        v.silenceMs += chunkMs;
        if (v.silenceMs >= VAD.minSilenceMs) { finalizeUtterance(); return; }
      }
      if (utteranceRef.current.ms >= VAD.maxUtteranceMs) finalizeUtterance();
    }
  }

  async function initAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Microfone indisponível neste navegador. Abra no Safari/Chrome com HTTPS.');
    }

    inputCtxRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await inputCtxRef.current.resume().catch(() => {});
    inputSampleRateRef.current = Math.round(inputCtxRef.current.sampleRate || 16000);

    micStreamRef.current = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
      },
    });

    const micTrack = micStreamRef.current.getAudioTracks()[0];
    if (micTrack) {
      micTrackRef.current = micTrack;
      micTrack.addEventListener('ended', micTrackLost);
      micTrack.addEventListener('mute', micTrackLost);
    }

    const source = inputCtxRef.current.createMediaStreamSource(micStreamRef.current);
    micSourceRef.current = source;
    micMonitorGainRef.current = inputCtxRef.current.createGain();
    micMonitorGainRef.current.gain.value = 0;
    micMonitorGainRef.current.connect(inputCtxRef.current.destination);

    if (inputCtxRef.current.audioWorklet && window.AudioWorkletNode) {
      try {
        await inputCtxRef.current.audioWorklet.addModule('mic-worklet.js');
        workletRef.current = new AudioWorkletNode(inputCtxRef.current, 'mic-processor');
        workletRef.current.port.onmessage = (e) => {
          if (e.data && e.data.type === 'audio') {
            handleMicChunk(new Int16Array(e.data.data), e.data.rms);
          }
        };
        source.connect(workletRef.current);
        workletRef.current.connect(micMonitorGainRef.current);
        return;
      } catch (e) {
        // Cai no fallback ScriptProcessor abaixo.
      }
    }

    let fbBuf = [];
    let fbSamples = 0;
    let fbRmsSum = 0;
    let fbRmsCount = 0;
    const chunkSize = Math.max(1, Math.round((inputSampleRateRef.current * MIC_CHUNK_MS) / 1000));
    scriptProcessorRef.current = inputCtxRef.current.createScriptProcessor(4096, 1, 1);
    scriptProcessorRef.current.onaudioprocess = (event) => {
      const channel = event.inputBuffer.getChannelData(0);
      fbBuf.push(new Float32Array(channel));
      fbSamples += channel.length;
      for (let i = 0; i < channel.length; i++) { fbRmsSum += channel[i] * channel[i]; fbRmsCount++; }

      while (fbSamples >= chunkSize) {
        const pcm = new Int16Array(chunkSize);
        let out = 0;
        while (out < chunkSize && fbBuf.length) {
          const first = fbBuf[0];
          const take = Math.min(first.length, chunkSize - out);
          for (let i = 0; i < take; i++) {
            const s = Math.max(-1, Math.min(1, first[i]));
            pcm[out++] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          if (take === first.length) fbBuf.shift();
          else fbBuf[0] = first.subarray(take);
          fbSamples -= take;
        }
        const rms = Math.sqrt(fbRmsSum / Math.max(1, fbRmsCount));
        fbRmsSum = 0;
        fbRmsCount = 0;
        handleMicChunk(pcm, rms);
      }
    };
    source.connect(scriptProcessorRef.current);
    scriptProcessorRef.current.connect(micMonitorGainRef.current);
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      const lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => {
        if (wakeLockRef.current !== lock) return;
        if (statusRef.current === 'active' && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
      wakeLockRef.current = lock;
    } catch (_) {}
  }

  function startTimer() {
    startTimeRef.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startTimeRef.current) / 1000));
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerRef.current);
    timerRef.current = null;
  }

  function micErrorMessage(e) {
    const raw = String((e && e.message) || '');
    const name = String((e && e.name) || '');
    const denied = /permission|denied|notallowed|securityerror|insecure/i.test(raw + ' ' + name);
    if (denied) {
      let msg = 'Permissão do microfone negada. Permita o microfone nas configurações do site e tente novamente.';
      if (window.self !== window.top) {
        msg += ' No Preview embutido, abra o app em uma nova aba para usar o microfone.';
      }
      return msg;
    }
    return raw || 'falha ao acessar o microfone.';
  }

  async function start(config) {
    if (statusRef.current !== 'idle') return false;
    configRef.current = config;
    setError(null);
    setTransA([]);
    setTransB([]);
    transLenRef.current = { A: 0, B: 0 };
    resetVad();
    setMicLevel(0);
    inFlightRef.current = false;
    setAudioOnState(config.audio !== false);
    setMicOnState(true);
    setPausedState(false);
    setStatusState('connecting');
    try {
      if (config.mic === false) {
        // Modo somente texto: não pede o microfone; o usuário digita a fala
        // e o pipeline de tradução (backend + voz) continua funcionando.
        setMicOnState(false);
      } else {
        await initAudio();
      }
      setStatusState('active');
      startTimer();
      lastMicChunkRef.current = Date.now();
      micDeadWarnedRef.current = false;
      clearInterval(micWatchdogRef.current);
      micWatchdogRef.current = setInterval(() => {
        if (statusRef.current !== 'active' || !micOnRef.current || pausedRef.current) return;
        if (document.visibilityState !== 'visible') return;
        const deadFor = Date.now() - lastMicChunkRef.current;
        if (deadFor > 4000) resumeInputContext();
        if (deadFor > 9000 && !micDeadWarnedRef.current) {
          micDeadWarnedRef.current = true;
          setError('Nenhum áudio está chegando do microfone. Toque no botão do microfone para reconectar ou abra o app em uma nova aba e reinicie.');
        }
      }, 2500);
      await requestWakeLock();
      return true;
    } catch (e) {
      setError('Erro ao iniciar: ' + micErrorMessage(e));
      stop();
      return false;
    }
  }

  function stop() {
    setStatusState('idle');
    setPausedState(false);
    clearTimeout(cooldownTimerRef.current);
    cooldownTimerRef.current = null;
    if (window.TextToSpeechProvider) window.TextToSpeechProvider.cancel();
    if (workletRef.current) { try { workletRef.current.disconnect(); } catch (_) {} workletRef.current = null; }
    if (scriptProcessorRef.current) {
      scriptProcessorRef.current.onaudioprocess = null;
      scriptProcessorRef.current.disconnect();
      scriptProcessorRef.current = null;
    }
    if (micSourceRef.current) { micSourceRef.current.disconnect(); micSourceRef.current = null; }
    if (micMonitorGainRef.current) { micMonitorGainRef.current.disconnect(); micMonitorGainRef.current = null; }
    if (micTrackRef.current) {
      micTrackRef.current.removeEventListener('ended', micTrackLost);
      micTrackRef.current.removeEventListener('mute', micTrackLost);
      micTrackRef.current = null;
    }
    if (micStreamRef.current) { micStreamRef.current.getTracks().forEach((t) => t.stop()); micStreamRef.current = null; }
    if (inputCtxRef.current) { inputCtxRef.current.close(); inputCtxRef.current = null; }
    if (wakeLockRef.current) { try { wakeLockRef.current.release(); } catch (_) {} wakeLockRef.current = null; }
    stopTimer();
    clearInterval(micWatchdogRef.current);
    micWatchdogRef.current = null;
    setMicLevel(0);
    resetVad();
  }

  function pause() {
    setPausedState(true);
    setMicLevel(0);
    if (window.TextToSpeechProvider) window.TextToSpeechProvider.cancel();
    clearTimeout(cooldownTimerRef.current);
    cooldownTimerRef.current = null;
    resetVad();
  }

  function resume() {
    setPausedState(false);
    resumeInputContext();
    resetVad();
    if (statusRef.current !== 'idle') setStatusState('active');
  }

  function toggleAudio() {
    const next = !audioOnRef.current;
    setAudioOnState(next);
    if (!next && window.TextToSpeechProvider) window.TextToSpeechProvider.cancel();
  }

  function toggleMic() {
    const next = !micOnRef.current;
    setMicOnState(next);
    if (!next) { setMicLevel(0); resetVad(); return; }
    // Modo texto: ainda não há stream de áudio — tenta obter o microfone agora.
    if (!inputCtxRef.current && !micStreamRef.current) {
      setError(null);
      initAudio()
        .then(() => { if (statusRef.current !== 'idle') resumeInputContext(); })
        .catch((e) => {
          setMicOnState(false);
          setError('Microfone indisponível: ' + micErrorMessage(e));
        });
    } else {
      resumeInputContext();
    }
  }

  function sendText(text) {
    const t = (text || '').trim();
    if (!t) return;
    if (statusRef.current !== 'active' && statusRef.current !== 'cooldown') return;
    translateRequest({ text: t });
  }

  return {
    status, paused, micOn, audioOn, elapsed, error, micLevel, transA, transB,
    start, stop, pause, resume, toggleAudio, toggleMic, sendText,
  };
}

function MicMutedIcon({ size = 16, color = 'currentColor' }) {

    <svg width={size} height={size} viewBox="0 0 16 20" fill="none">
      <rect x="5" y="1" width="6" height="11" rx="3" fill={color} />

function fmtTime(secs) {
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  return `${m}:${s}`;
}

// ============================================================
// TRADUÇÃO (legenda grande)
// ============================================================
function TranslationView({ lang, translations, theme, padTop, padBot, listening, statusText }) {
  const lastInIdx = translations.map((t, i) => (!t.isOutput ? i : -1)).filter((i) => i >= 0).pop();
  const lastOutIdx = translations.map((t, i) => (t.isOutput ? i : -1)).filter((i) => i >= 0).pop();
  let heroIdx = -1;
  if (lastInIdx !== undefined && lastOutIdx !== undefined) heroIdx = lastOutIdx >= lastInIdx ? lastOutIdx : lastInIdx;
  else if (lastOutIdx !== undefined) heroIdx = lastOutIdx;
  else if (lastInIdx !== undefined) heroIdx = lastInIdx;
  const latest = heroIdx >= 0 ? translations[heroIdx] : null;
  const history = translations.filter((_, i) => i !== heroIdx).slice(-3);

  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      padding: `${padTop || 12}px 18px ${padBot || 12}px`,
      background: theme.halfBg(lang.color),
      overflow: 'hidden', fontFamily: theme.font, minHeight: 0,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
        <span style={{ fontSize: 18, lineHeight: 1 }}>{lang.flag}</span>
        <span style={{ fontSize: 11, fontWeight: 700, color: lang.color, textTransform: 'uppercase', letterSpacing: 0.8 }}>
          {lang.label}
        </span>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 5 }}>
          <div style={{
            width: 6, height: 6, borderRadius: '50%',
            background: listening ? theme.success : '#C0C0C0',
            boxShadow: listening ? `0 0 6px ${theme.success}80` : 'none',
            animation: listening ? 'pulse 2s infinite' : 'none',
          }} />
          <span style={{ fontSize: 10, color: theme.textSec }}>{statusText || '…'}</span>
        </div>
      </div>

      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 0, padding: '8px 0' }}>
        {latest ? (
          <div key={translations.length} style={{ textAlign: 'center', animation: 'slideUp 0.3s ease' }}>
            <p style={{
              fontSize: 28, fontWeight: 600, color: theme.text,
              lineHeight: 1.22, margin: 0, textWrap: 'balance', letterSpacing: -0.3,
              opacity: latest.isOutput ? 1 : 0.88,
            }}>{latest.text}</p>
          </div>
        ) : (
          <p style={{ fontSize: 14, color: theme.textTer, margin: 0, textAlign: 'center' }}>
            Aguardando tradução…
          </p>
        )}
      </div>

      {history.length > 0 && (
        <div style={{ flexShrink: 0, display: 'flex', flexDirection: 'column', borderTop: `1px solid ${theme.divider}`, paddingTop: 6 }}>
          {history.map((t, i, arr) => {
            const opacity = 0.18 + (i / Math.max(arr.length - 1, 1)) * 0.25;
            return (
              <p key={i + '-' + t.text.slice(0, 8)} style={{
                fontSize: 12, color: theme.text, opacity,
                margin: '1px 0', lineHeight: 1.3, textAlign: 'center',
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{t.text}</p>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================
// TELA ATIVA
// ============================================================
function ActiveScreen({ config, theme, translator, onEnd }) {
  const [restLeft, setRestLeft] = React.useState(null);
  const [typedText, setTypedText] = React.useState('');
  const [layout, setLayout] = React.useState(() => localStorage.getItem('layout') || 'vertical');
  const [showLayoutMenu, setShowLayoutMenu] = React.useState(false);

  React.useEffect(() => { localStorage.setItem('layout', layout); }, [layout]);

  React.useEffect(() => {
    if (restLeft === null) return;
    if (restLeft === 0) {
      if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      const t = setTimeout(() => setRestLeft(null), 2500);
      return () => clearTimeout(t);
    }
    const id = setInterval(() => setRestLeft((s) => (s <= 1 ? 0 : s - 1)), 1000);
    return () => clearInterval(id);
  }, [restLeft]);

  function startRest() { setRestLeft(60); }
  function cancelRest() { setRestLeft(null); }

  function submitInput() {
    const t = typedText.trim();
    if (!t) return;
    translator.sendText(t);
    setTypedText('');
  }

  const langA = langById(config.langA);
  const langB = langById(config.langB);
  const listening = translator.status === 'active' && !translator.paused && translator.micOn;
  const statusText = translator.status === 'active' && !translator.micOn
    ? 'Somente texto — digite para traduzir'
    : (STATUS_LABEL[translator.status] || '…');
  const isVert = layout !== 'horizontal';
  const isRotated = layout === 'vertical';
  const padB = isRotated ? { top: 8, bot: 22 } : { top: 10, bot: 10 };
  const padA = isRotated ? { top: 22, bot: 8 } : { top: 10, bot: 10 };

  const ctrlBtn = (child, opts = {}) => (
    <button type="button" onClick={opts.onClick} title={opts.title} style={{
      width: 40, height: 40, borderRadius: '50%',
      border: `1px solid ${opts.danger ? theme.danger + '40' : opts.active ? theme.primary + '40' : theme.divider}`,
      background: opts.danger ? theme.danger + '12' : opts.active ? theme.primary + '12' : theme.cardBg,
      cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: opts.danger ? theme.danger : opts.active ? theme.primary : theme.textSec,
      outline: 'none', fontSize: 15, flexShrink: 0, fontFamily: theme.font,
    }}>{child}</button>
  );

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative', fontFamily: theme.font, background: theme.bg }}>
      {translator.error && (
        <div style={{
          flexShrink: 0, padding: '10px 14px', background: theme.danger + '18', color: theme.danger,
          fontSize: 13, fontWeight: 600, textAlign: 'center', borderBottom: `1px solid ${theme.danger}40`,
        }}>{translator.error}</div>
      )}

      {restLeft !== null && (
        <div style={{
          position: 'absolute', top: 10, right: 12, zIndex: 60, display: 'flex', alignItems: 'center', gap: 8,
          padding: '8px 12px', borderRadius: 24, background: restLeft <= 0 ? theme.success : 'rgba(0,0,0,0.78)',
          boxShadow: '0 2px 12px rgba(0,0,0,0.2)',
        }}>
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.75)', textTransform: 'uppercase', letterSpacing: 0.6 }}>
            {restLeft <= 0 ? 'Pronto' : 'Descanso'}
          </span>
          <span style={{ fontSize: 20, fontWeight: 600, color: '#fff', fontVariantNumeric: 'tabular-nums', minWidth: 52, textAlign: 'center' }}>
            {restLeft <= 0 ? '00:00' : fmtTime(restLeft)}
          </span>
          {restLeft > 0 && (
            <button type="button" onClick={cancelRest} aria-label="Parar cronômetro" style={{
              width: 28, height: 28, borderRadius: '50%', border: 'none', background: 'rgba(255,255,255,0.2)',
              color: '#fff', fontSize: 16, cursor: 'pointer', lineHeight: 1, fontFamily: theme.font,
            }}>×</button>
          )}
        </div>
      )}

      {translator.paused && (
        <PausedOverlay
          elapsed={translator.elapsed}
          msgCount={translator.transA.length + translator.transB.length}
          onResume={translator.resume}
          onEnd={onEnd}
          theme={theme} />
      )}

      <div style={{ flex: '1 1 0%', display: 'flex', flexDirection: isVert ? 'column' : 'row', overflow: 'hidden', minHeight: 0 }}>
        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          transform: isRotated ? 'rotate(180deg)' : 'none',
          overflow: 'hidden', minHeight: 0, minWidth: 0,
          borderBottom: isVert ? `1px solid ${theme.divider}` : 'none',
          borderRight: !isVert ? `1px solid ${theme.divider}` : 'none',
        }}>
          <TranslationView lang={langB} translations={translator.transB} theme={theme}
            padTop={padB.top} padBot={padB.bot} listening={listening} statusText={statusText} />
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minHeight: 0, minWidth: 0 }}>
          <TranslationView lang={langA} translations={translator.transA} theme={theme}
            padTop={padA.top} padBot={padA.bot} listening={listening} statusText={statusText} />
        </div>
      </div>

      {showLayoutMenu && (
        <div style={{
          position: 'absolute', bottom: 118, left: '50%', transform: 'translateX(-50%)',
          background: theme.cardBg, borderRadius: theme.radius, boxShadow: '0 6px 24px rgba(0,0,0,0.18)',
          border: `1px solid ${theme.divider}`, padding: 6, zIndex: 55, width: 210,
          display: 'flex', flexDirection: 'column', gap: 2,
        }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: theme.textSec, padding: '6px 10px 4px', letterSpacing: 0.6, textTransform: 'uppercase' }}>
            Visualização
          </div>
          {[
            { v: 'vertical', l: 'Frente a frente', hint: 'Um de cabeça para baixo' },
            { v: 'same', l: 'Mesmo lado', hint: 'Os dois em cima e embaixo' },
            { v: 'horizontal', l: 'Lado a lado', hint: 'Dividido na horizontal' },
          ].map((opt) => (
            <button key={opt.v} type="button" onClick={() => { setLayout(opt.v); setShowLayoutMenu(false); }} style={{
              padding: '10px 12px', textAlign: 'left',
              background: layout === opt.v ? theme.primary + '12' : 'transparent',
              color: layout === opt.v ? theme.primary : theme.text,
              border: 'none', borderRadius: 8, cursor: 'pointer', fontSize: 14, fontFamily: theme.font,
              fontWeight: layout === opt.v ? 600 : 400,
            }}>
              <span style={{ display: 'block' }}>{opt.l}</span>
              <span style={{ fontSize: 11, color: theme.textSec, fontWeight: 400 }}>{opt.hint}</span>
            </button>
          ))}
        </div>
      )}

      <div style={{ padding: '10px 16px 8px', borderTop: `1px solid ${theme.divider}`, background: theme.bg, flexShrink: 0 }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <input
            type="text"
            value={typedText}
            onChange={(e) => setTypedText(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') submitInput(); }}
            placeholder="Digite para traduzir (opcional)…"
            style={{
              flex: 1, padding: '12px 14px', borderRadius: theme.radius,
              border: `1px solid ${theme.divider}`, background: theme.cardBg,
              color: theme.text, fontSize: 16, outline: 'none', fontFamily: theme.font,
            }}
          />
          <button type="button" onClick={submitInput} disabled={!typedText.trim()} style={{
            padding: '12px 16px', borderRadius: theme.radius,
            background: typedText.trim() ? theme.primary : theme.textTer,
            color: '#FFF', border: 'none', fontSize: 15, fontWeight: 600,
            cursor: typedText.trim() ? 'pointer' : 'not-allowed', fontFamily: theme.font,
          }}>Enviar</button>
        </div>
      </div>

      <div style={{ padding: '10px 16px 6px', display: 'flex', gap: 10, flexShrink: 0, borderTop: `1px solid ${theme.divider}` }}>
        <button onClick={startRest} style={{
          flex: 1, padding: '14px 8px', borderRadius: theme.radius, background: '#5856D6', color: '#FFF',
          border: 'none', fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>⏱ Cronômetro</button>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, padding: '6px 16px 12px', flexShrink: 0 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: theme.textSec, fontVariantNumeric: 'tabular-nums', minWidth: 42 }}>
          {fmtTime(translator.elapsed)}
        </span>
        {translator.micOn && (
          <div title="Nível do microfone" style={{ width: 52, height: 6, borderRadius: 3, background: theme.divider, overflow: 'hidden', flexShrink: 0 }}>
            <div style={{
              width: `${Math.min(100, Math.round(translator.micLevel * 220))}%`,
              height: '100%', borderRadius: 3,
              background: translator.micLevel > 0.02 ? theme.success : theme.textTer,
              transition: 'width 120ms linear',
            }} />
          </div>
        )}
        {ctrlBtn(translator.micOn ? <MicIcon size={14} /> : <MicMutedIcon size={14} />,
          { onClick: translator.toggleMic, active: translator.micOn, title: 'Microfone' })}
        {ctrlBtn(translator.audioOn ? '🔊' : '🔇',
          { onClick: translator.toggleAudio, active: translator.audioOn, title: 'Áudio' })}
        {ctrlBtn(
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="12" height="5" rx="1" stroke="currentColor" strokeWidth="1.2"/>
            <rect x="1" y="8" width="12" height="5" rx="1" stroke="currentColor" strokeWidth="1.2"/>
          </svg>,
          { onClick: () => setShowLayoutMenu((v) => !v), active: showLayoutMenu, title: 'Visualização' }
        )}
        {ctrlBtn('⏸', { onClick: translator.pause, title: 'Pausar' })}
        {ctrlBtn('⏹', { onClick: onEnd, danger: true, title: 'Encerrar' })}
      </div>
    </div>
  );
}

// ============================================================
// PAUSED / END / SPLASH
// ============================================================
function PausedOverlay({ elapsed, msgCount, onResume, onEnd, theme }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100, background: 'rgba(0,0,0,0.55)',
      backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12,
      fontFamily: theme.font, animation: 'fadeIn 0.2s ease',
    }}>
      <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'rgba(255,255,255,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 4 }}>
        <svg width="22" height="26" viewBox="0 0 12 14" fill="none">
          <rect x="1" y="1" width="4" height="12" rx="1" fill="#FFF"/>
          <rect x="7" y="1" width="4" height="12" rx="1" fill="#FFF"/>
        </svg>
      </div>
      <span style={{ fontSize: 20, fontWeight: 600, color: '#FFF' }}>Sessão Pausada</span>
      <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)' }}>
        {fmtTime(elapsed)} · {msgCount} {msgCount === 1 ? 'mensagem' : 'mensagens'}
      </span>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 200, marginTop: 8 }}>
        <button onClick={onResume} style={{
          padding: '15px', borderRadius: theme.radius, width: '100%', background: theme.primary,
          color: '#FFF', border: 'none', fontSize: 16, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>Retomar</button>
        <button onClick={onEnd} style={{
          padding: '15px', borderRadius: theme.radius, width: '100%', background: 'rgba(255,255,255,0.1)',
          color: '#FFF', border: '1px solid rgba(255,255,255,0.2)', fontSize: 16, fontWeight: 600,
          cursor: 'pointer', fontFamily: theme.font,
        }}>Encerrar</button>
      </div>
    </div>
  );
}

function EndScreen({ elapsed, msgCount, history, onNew, theme }) {
  const [copied, setCopied] = React.useState(false);

  const exportHistory = () => {
    if (!history || history.length === 0) return;
    const lines = history.map((h) => `[${h.isOutput ? 'Tradução' : 'Original'}] ${h.text}`);
    const txt = `Sessão Tradutor Will — ${fmtTime(elapsed)}\n\n${lines.join('\n')}`;
    navigator.clipboard.writeText(txt).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {});
  };

  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: '40px 32px', background: theme.bg, fontFamily: theme.font, gap: 4, minHeight: '100%',
    }}>
      <div style={{ width: 60, height: 60, borderRadius: '50%', background: theme.success + '15', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 8 }}>
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M6 14l6 6 10-10" stroke={theme.success} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: theme.text, margin: 0 }}>Sessão Encerrada</h2>
      <p style={{ fontSize: 15, color: theme.textSec, margin: '2px 0 0' }}>Duração: {fmtTime(elapsed)}</p>
      <p style={{ fontSize: 15, color: theme.textSec, margin: '2px 0 24px' }}>
        {msgCount} {msgCount === 1 ? 'mensagem traduzida' : 'mensagens traduzidas'}
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: 220 }}>
        {history && history.length > 0 && (
          <button onClick={exportHistory} style={{
            padding: '14px', borderRadius: theme.radius, background: theme.cardBg, color: theme.text,
            border: `1px solid ${theme.divider}`, fontSize: 15, fontWeight: 500, cursor: 'pointer',
            fontFamily: theme.font, boxShadow: theme.cardShadow,
          }}>{copied ? 'Copiado!' : 'Copiar Histórico'}</button>
        )}
        <button onClick={onNew} style={{
          padding: '16px', borderRadius: theme.radius, background: theme.primary, color: '#FFF',
          border: 'none', fontSize: 17, fontWeight: 600, cursor: 'pointer', fontFamily: theme.font,
        }}>Nova Sessão</button>
      </div>
    </div>
  );
}

function SplashScreen({ onDone }) {
  const [fadeOut, setFadeOut] = React.useState(false);

  React.useEffect(() => {
    const fadeTimer = setTimeout(() => setFadeOut(true), 900);
    const doneTimer = setTimeout(onDone, 1300);
    return () => {
      clearTimeout(fadeTimer);
      clearTimeout(doneTimer);
    };
  }, []);

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999, background: '#FFFFFF',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      opacity: fadeOut ? 0 : 1, transition: 'opacity 0.45s ease-out',
    }}>
      <img src="logo.png" alt="Will Translator" style={{ width: 'min(58vmin, 300px)', height: 'auto', objectFit: 'contain' }} />
    </div>
  );
}

// ============================================================
// APP PRINCIPAL
// ============================================================
function TradutorApp() {
  const [splash, setSplash] = React.useState(true);
  const [screen, setScreen] = React.useState('setup');
  const [config, setConfig] = React.useState(null);
  const [endStats, setEndStats] = React.useState({ elapsed: 0, msgCount: 0, history: [] });
  const theme = THEME;
  const translator = useTranslator();

  React.useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }, []);

  const handleStart = async (cfg) => {
    setConfig(cfg);
    const ok = await translator.start(cfg);
    if (ok) setScreen('active');
  };

  const handleEnd = () => {
    const history = [...translator.transA, ...translator.transB].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    setEndStats({ elapsed: translator.elapsed, msgCount: history.length, history });
    translator.stop();
    setScreen('end');
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden' }}>
      {splash && <SplashScreen onDone={() => setSplash(false)} />}
      {!splash && screen === 'setup' && (
        <SetupScreen onStart={handleStart} theme={theme} error={translator.error}
          starting={translator.status !== 'idle'} />
      )}
      {!splash && screen === 'active' && config && (
        <ActiveScreen config={config} theme={theme} translator={translator} onEnd={handleEnd} />
      )}
      {!splash && screen === 'end' && (
        <EndScreen
          elapsed={endStats.elapsed}
          msgCount={endStats.msgCount}
          history={endStats.history}
          onNew={() => setScreen('setup')}
          theme={theme} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TradutorApp />);
  </script>
</body>
